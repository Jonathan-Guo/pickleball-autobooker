name: Scheduled Pickleball Autobooker

on:
  schedule:
    # Runs at 00:00 every day (UTC)
    - cron: '30 22 * * 2'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  book-court:
    runs-on: ubuntu-latest
    
    # Optional: Set the base directory for all 'run' steps in this job
    defaults:
      run:
        working-directory: ./pickleball-autobooker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # Explicitly ensures it pulls from the main branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './pickleball-autobooker/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Run Auto Booker
        # Runs the 'start' script defined in your package.json
        run: npm start
        env:
          # If your script requires login info, add secrets in your Repo Settings
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
