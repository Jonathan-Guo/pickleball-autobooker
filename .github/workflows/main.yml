name: Scheduled Pickleball Autobooker

on:
  schedule:
    # Runs at 22:30 UTC every Tuesday
    - cron: '30 22 * * 2'
  workflow_dispatch: 

jobs:
  book-court:
    runs-on: ubuntu-latest
    strategy:
      # Use fail-fast: false so if one person's booking fails, others still continue
      fail-fast: false
      matrix:
        # Add a number for every account you want to run
        account_id: [1, 2]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm install

      # If you are using Playwright, you may need to install browser binaries
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Auto Booker
        run: npm start
        env:
          # Dynamically pulls USER_1_EMAIL, USER_2_EMAIL, etc. based on the matrix index
          LIFETIME_USERNAME: ${{ secrets[format('USER_{0}_EMAIL', matrix.account_id)] }}
          LIFETIME_PASSWORD: ${{ secrets[format('USER_{0}_PASSWORD', matrix.account_id)] }}
